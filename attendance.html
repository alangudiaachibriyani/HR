<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:sans-serif;background:#f7f7f5;color:#1a1a1a;font-size:13px;}
.container{max-width:1100px;margin:0 auto;padding:1.5rem 1rem 3rem;}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:1.25rem;}
.topbar img{height:50px;width:50px;border-radius:50%;object-fit:contain;flex-shrink:0;background:#fff;border:1px solid #eee;}
h1{font-size:18px;font-weight:600;margin-bottom:2px;}
.sub{font-size:12px;color:#666;}
.controls{display:flex;gap:10px;margin-bottom:1.5rem;flex-wrap:wrap;align-items:center;}
select,button{font-size:12px;padding:6px 12px;border:1px solid #ddd;border-radius:6px;background:#fff;cursor:pointer;}
button{background:#1a1a1a;color:#fff;border:none;}
.info{font-size:11px;color:#888;margin-left:4px;}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:1.5rem;}
.kpi{background:#fff;border-radius:8px;padding:.85rem 1rem;border:1px solid #eee;}
.kpi-label{font-size:11px;color:#888;margin-bottom:4px;}
.kpi-val{font-size:20px;font-weight:600;}
.kpi-sub{font-size:10px;color:#aaa;margin-top:2px;}
.sec{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#888;margin-bottom:.75rem;margin-top:1.5rem;}
.table-wrap{overflow-x:auto;margin-bottom:1rem;}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;border:1px solid #eee;font-size:12px;}
th{background:#f0f0ee;padding:8px 10px;text-align:left;font-weight:500;font-size:11px;color:#555;white-space:nowrap;}
td{padding:7px 10px;border-top:1px solid #f0f0ee;white-space:nowrap;}
tr:hover td{background:#fafaf8;}
.P{background:#d4edda;color:#155724;border-radius:3px;padding:1px 5px;font-size:10px;}
.H{background:#fff3cd;color:#856404;border-radius:3px;padding:1px 5px;font-size:10px;}
.A{background:#f8d7da;color:#721c24;border-radius:3px;padding:1px 5px;font-size:10px;}
.bm{background:#e8f4fd;color:#1565c0;font-size:10px;padding:2px 7px;border-radius:4px;}
.bd{background:#e8f5e9;color:#2e7d32;font-size:10px;padding:2px 7px;border-radius:4px;}
.green{color:#1D9E75;font-weight:600;}
.team-row td{background:#f7f7f5;font-weight:600;font-size:11px;color:#888;padding:5px 10px;}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:.5rem;font-size:11px;color:#666;}
</style>
</head>
<body>
<div class="container">
  <div class="topbar">
    <img src="https://raw.githubusercontent.com/alangudiaachibriyani/HR/main/logo.png" alt="logo">
    <div><h1>Alangudi Aachi Biriyani</h1><div class="sub">Attendance & Salary Report</div></div>
  </div>
  <div class="controls">
    <select id="selMonth"></select>
    <select id="selYear"></select>
    <button onclick="generate()">Generate Report</button>
    <span class="info" id="info"></span>
  </div>
  <div id="app"><p style="color:#888;padding:2rem 0;">Select month and click Generate Report</p></div>
</div>
<script>
const URL = "https://script.google.com/macros/s/AKfycbz_J4uu4K0641pG2Tm9WyJ7gDG3iYGfiD_v7xNbzGcDCKPNWj0co_-BDJqh0j7le5Nr/exec";
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const SHORT = ['Su','Mo','Tu','We','Th','Fr','Sa'];
const WD_BASIS = 26;
let cache = null;

// Init dropdowns
(function(){
  const ms = document.getElementById('selMonth');
  const ys = document.getElementById('selYear');
  ['January','February','March','April','May','June','July','August','September','October','November','December']
    .forEach((m,i)=>{ const o=document.createElement('option'); o.value=i; o.textContent=m; ms.appendChild(o); });
  const now = new Date();
  ms.value = now.getMonth();
  for(let y=2025;y<=2027;y++){ const o=document.createElement('option'); o.value=y; o.textContent=y; ys.appendChild(o); }
  ys.value = now.getFullYear();
})();

function dk(d){ // date key YYYY-MM-DD
  return d.getFullYear()+'-'+(d.getMonth()+1).toString().padStart(2,'0')+'-'+d.getDate().toString().padStart(2,'0');
}

function firstName(s){ return (s||'').trim().split(/[\s,]+/)[0]; }

function parseNames(str){
  if(!str) return [];
  return str.split(',').map(n=>firstName(n)).filter(Boolean);
}

async function fetchData(){
  if(cache) return cache;
  const r = await fetch(URL);
  const j = await r.json();
  if(j.status !== 'ok') throw new Error(j.message);
  cache = j;
  return j;
}

async function generate(){
  const month = parseInt(document.getElementById('selMonth').value);
  const year  = parseInt(document.getElementById('selYear').value);
  const app   = document.getElementById('app');
  const info  = document.getElementById('info');
  app.innerHTML = '<p style="color:#888;padding:2rem 0;">⏳ Loading...</p>';
  info.textContent = '';

  try {
    const j = await fetchData();

    // Build salary master from sheet
    const SM = {}; // employee name -> {type,rate,team,role,status,otRate}
    (j.salaryMaster||[]).forEach(e=>{
      const otR = (e.otRate !== null && e.otRate !== undefined && e.otRate !== 'NA')
                  ? parseFloat(e.otRate) || null : null;
      SM[e.employee] = {
        type:   e.payType.toLowerCase().includes('month') ? 'monthly' : 'daily',
        rate:   parseFloat(e.rate)||0,
        team:   e.team,
        role:   e.role,
        status: e.status,
        otRate: otR
      };
    });

    // Parse sessions filtered to month
    const today  = new Date();
    const isCurr = today.getMonth()===month && today.getFullYear()===year;
    const cutoff = isCurr ? today : new Date(year,month+1,0);

    const sessions = (j.data||[]).map(r=>{
      const d = new Date(r.date);
      return { date:d, session:r.session,
               kitchen: parseNames(r.kitchenPresent),
               shop:    parseNames(r.shopPresent),
               otHours: parseFloat(r.otHours)||0 };
    }).filter(r=>!isNaN(r.date) && r.date.getMonth()===month && r.date.getFullYear()===year && r.date<=cutoff);

    // Working dates (no Monday)
    const allDates = [];
    for(let d=new Date(year,month,1); d<=new Date(year,month+1,0)&&d<=cutoff; d.setDate(d.getDate()+1)){
      if(d.getDay()!==1) allDates.push(new Date(d));
    }

    // dayMap: dk -> {lunch:Set, dinner:Set}
    const dayMap = {};
    sessions.forEach(s=>{
      const key = dk(s.date);
      if(!dayMap[key]) dayMap[key] = {lunch:new Set(), dinner:new Set()};
      const all = [...s.kitchen, ...s.shop];
      if(s.session==='Lunch')  all.forEach(n=>dayMap[key].lunch.add(n));
      if(s.session==='Dinner') all.forEach(n=>dayMap[key].dinner.add(n));
    });

    // OT map: dk -> hours
    const otMap = {};
    sessions.forEach(s=>{
      if(s.otHours > 0){
        const key = dk(s.date);
        otMap[key] = Math.max(otMap[key]||0, s.otHours);
      }
    });

    // Active employees + relieved who worked this month
    const allWorked = new Set();
    sessions.forEach(s=>[...s.kitchen,...s.shop].forEach(n=>allWorked.add(n)));
    const emps = Object.keys(SM).filter(e=>{
      const s = SM[e];
      if(!s.status) return true;
      if(s.status.toLowerCase()==='active') return true;
      return allWorked.has(firstName(e));
    });

    // Attendance per employee
    const stats = {};
    emps.forEach(emp=>{
      let daysWorked = 0;
      const log = {};
      const fn = firstName(emp);
      allDates.forEach(d=>{
        const key = dk(d);
        const rec = dayMap[key];
        const inL = rec && rec.lunch.has(fn);
        const inD = rec && rec.dinner.has(fn);
        let st = 'A';
        if(inL&&inD){ st='P'; daysWorked+=1; }
        else if(inL||inD){ st='H'; daysWorked+=0.5; }
        log[key] = st;
      });
      stats[emp] = {daysWorked, log};
    });

    // Salary + OT calc
    const calc = emps.map(emp=>{
      const s = SM[emp];
      const {daysWorked, log} = stats[emp];
      const salary = s.type==='monthly'
        ? Math.round(daysWorked * (s.rate/WD_BASIS))
        : Math.round(daysWorked * s.rate);
      let otEarned=0, otHrs=0;
      if(s.otRate && s.otRate>0){
        Object.entries(otMap).forEach(([key,hrs])=>{
          const st = log[key];
          if(st==='P'||st==='H'){
            otHrs += hrs;
            otEarned += Math.round(hrs * s.otRate);
          }
        });
      }
      return { emp, ...s, daysWorked, salary, otEarned, otHrs };
    });

    const totSalary = calc.reduce((s,r)=>s+r.salary,0);
    const totOT     = calc.reduce((s,r)=>s+r.otEarned,0);
    const totOTHrs  = Object.values(otMap).reduce((s,v)=>s+v,0);
    const grand     = totSalary + totOT;
    const activeN   = emps.filter(e=>SM[e].status&&SM[e].status.toLowerCase()==='active').length;
    const monthName = ['January','February','March','April','May','June','July','August','September','October','November','December'][month];

    info.textContent = `${monthName} ${year} · up to ${cutoff.toLocaleDateString('en-IN',{day:'numeric',month:'short'})}`;

    // ── Render ──
    let h = '';

    // KPIs
    h += `<div class="kpi-grid">
      <div class="kpi"><div class="kpi-label">Working days</div><div class="kpi-val">${allDates.length}</div><div class="kpi-sub">${monthName} (excl. Mondays)</div></div>
      <div class="kpi"><div class="kpi-label">Salary total</div><div class="kpi-val">₹${totSalary.toLocaleString('en-IN')}</div><div class="kpi-sub">excl. OT</div></div>
      <div class="kpi"><div class="kpi-label">OT pay</div><div class="kpi-val">₹${totOT.toLocaleString('en-IN')}</div><div class="kpi-sub">${totOTHrs} hrs · ${Object.keys(otMap).length} days</div></div>
      <div class="kpi"><div class="kpi-label">Grand total</div><div class="kpi-val green">₹${grand.toLocaleString('en-IN')}</div><div class="kpi-sub">salary + OT</div></div>
      <div class="kpi"><div class="kpi-label">Active staff</div><div class="kpi-val">${activeN}</div><div class="kpi-sub">in salary master</div></div>
    </div>`;

    // Salary table
    h += `<div class="sec">Salary Summary</div><div class="table-wrap"><table>
      <thead><tr><th>Employee</th><th>Team</th><th>Role</th><th>Type</th><th>Rate</th><th>Days</th><th>Salary</th><th>OT Pay</th><th>Total</th></tr></thead><tbody>`;
    ['Kitchen','Shop'].forEach(team=>{
      const rows = calc.filter(r=>r.team===team);
      if(!rows.length) return;
      h += `<tr class="team-row"><td colspan="9">${team} Team</td></tr>`;
      rows.forEach(r=>{
        const rel = r.status&&r.status.toLowerCase()==='relieved' ? ` <span style="font-size:10px;color:#999;">(Relieved)</span>` : '';
        const typeTag = r.type==='monthly' ? `<span class="bm">Monthly</span>` : `<span class="bd">Daily</span>`;
        const rateStr = r.type==='monthly' ? `₹${r.rate.toLocaleString('en-IN')}/mo` : `₹${r.rate}/day`;
        const otCell = r.otRate&&r.otRate>0
          ? `₹${r.otEarned.toLocaleString('en-IN')}<br><span style="font-size:10px;color:#888;">${r.otHrs}h×₹${r.otRate}</span>`
          : `<span style="color:#ccc;">—</span>`;
        h += `<tr>
          <td><strong>${r.emp}</strong>${rel}</td>
          <td>${r.team}</td><td>${r.role}</td><td>${typeTag}</td><td>${rateStr}</td>
          <td>${r.daysWorked}d</td>
          <td>₹${r.salary.toLocaleString('en-IN')}</td>
          <td>${otCell}</td>
          <td class="green">₹${(r.salary+r.otEarned).toLocaleString('en-IN')}</td>
        </tr>`;
      });
    });
    h += `<tr style="background:#f7f7f5;">
      <td colspan="6" style="text-align:right;font-weight:600;">Total</td>
      <td style="font-weight:700;">₹${totSalary.toLocaleString('en-IN')}</td>
      <td style="font-weight:700;">₹${totOT.toLocaleString('en-IN')}</td>
      <td style="font-weight:700;font-size:14px;" class="green">₹${grand.toLocaleString('en-IN')}</td>
    </tr></tbody></table></div>`;

    // OT Summary
    if(Object.keys(otMap).length > 0){
      h += `<div class="sec">⏱ OT Summary</div><div class="table-wrap"><table>
        <thead><tr><th>Date</th><th>Day</th><th>OT Hours</th><th>Eligible Employees</th><th>OT Amount</th></tr></thead><tbody>`;
      Object.entries(otMap).sort().forEach(([key,hrs])=>{
        const d = new Date(key);
        const eligible = calc.filter(r=>r.otRate&&r.otRate>0&&(stats[r.emp]?.log?.[key]==='P'||stats[r.emp]?.log?.[key]==='H'));
        const amt = eligible.reduce((s,r)=>s+Math.round(hrs*r.otRate),0);
        h += `<tr>
          <td>${d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}</td>
          <td>${DAYS[d.getDay()]}</td>
          <td><strong>${hrs} hrs</strong></td>
          <td>${eligible.map(r=>r.emp).join(', ')||'—'}</td>
          <td class="green">₹${amt.toLocaleString('en-IN')}</td>
        </tr>`;
      });
      h += `</tbody></table></div>`;
    }

    // Attendance grid
    h += `<div class="sec">Day-wise Attendance Grid</div><div class="table-wrap"><table><thead><tr><th>Employee</th>`;
    allDates.forEach(d=>{ h+=`<th style="min-width:32px;text-align:center;">${d.getDate()}<br><span style="font-size:9px;color:#aaa;">${SHORT[d.getDay()]}</span></th>`; });
    h += `<th>Days</th></tr></thead><tbody>`;
    ['Kitchen','Shop'].forEach(team=>{
      const rows = emps.filter(e=>SM[e].team===team);
      if(!rows.length) return;
      h += `<tr class="team-row"><td colspan="${allDates.length+2}">${team} Team</td></tr>`;
      rows.forEach(emp=>{
        const {daysWorked,log} = stats[emp];
        h += `<tr><td><strong>${emp}</strong><br><span style="font-size:10px;color:#aaa;">${SM[emp].role}</span></td>`;
        allDates.forEach(d=>{
          const st = log[dk(d)]||'A';
          h += `<td style="text-align:center;"><span class="${st}">${st==='H'?'½':st}</span></td>`;
        });
        h += `<td><strong>${daysWorked}</strong></td></tr>`;
      });
    });
    h += `</tbody></table></div>
    <div class="legend">
      <span><span class="P">P</span> Present (full day)</span>
      <span><span class="H">½</span> Half day</span>
      <span><span class="A">A</span> Absent</span>
    </div>`;

    app.innerHTML = h;

  } catch(e){
    app.innerHTML = `<p style="color:#A32D2D;padding:2rem 0;">Error: ${e.message}</p>`;
  }
}
</script>
</body>
</html>
