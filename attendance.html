<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:sans-serif;background:#f7f7f5;color:#1a1a1a;font-size:13px;}
.container{max-width:1100px;margin:0 auto;padding:1.5rem 1rem 3rem;}
h1{font-size:18px;font-weight:600;margin-bottom:2px;}
.sub{font-size:12px;color:#666;margin-bottom:1.5rem;}
.controls{display:flex;gap:10px;margin-bottom:1.5rem;flex-wrap:wrap;align-items:center;}
select,button{font-size:12px;padding:6px 12px;border:1px solid #ddd;border-radius:6px;background:#fff;cursor:pointer;}
button{background:#1a1a1a;color:#fff;border:none;}
button:hover{background:#333;}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:1.5rem;}
.kpi{background:#fff;border-radius:8px;padding:.85rem 1rem;border:1px solid #eee;}
.kpi-label{font-size:11px;color:#888;margin-bottom:4px;}
.kpi-val{font-size:20px;font-weight:600;}
.kpi-sub{font-size:10px;color:#aaa;margin-top:2px;}
.section-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#888;margin-bottom:.75rem;}
.table-wrap{overflow-x:auto;margin-bottom:1.5rem;}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;border:1px solid #eee;font-size:12px;}
th{background:#f0f0ee;padding:8px 10px;text-align:left;font-weight:500;font-size:11px;color:#555;white-space:nowrap;}
td{padding:7px 10px;border-top:1px solid #f0f0ee;white-space:nowrap;}
tr:hover td{background:#fafaf8;}
.present{background:#d4edda;color:#155724;border-radius:3px;padding:1px 5px;font-size:10px;}
.absent{background:#f8d7da;color:#721c24;border-radius:3px;padding:1px 5px;font-size:10px;}
.half{background:#fff3cd;color:#856404;border-radius:3px;padding:1px 5px;font-size:10px;}
.badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:4px;}
.tag-monthly{background:#e8f4fd;color:#1565c0;}
.tag-daily{background:#e8f5e9;color:#2e7d32;}
.salary-table td:last-child{font-weight:600;color:#1D9E75;}
.loading{text-align:center;padding:3rem;color:#888;}
.error{text-align:center;padding:2rem;color:#A32D2D;}
</style>
</head>
<body>
<div class="container">
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:.5rem;">
    <img src="https://alangudiachibriyani.github.io/HR/logo.png" alt="Alangudi Aachi Biriyani Logo" style="height:48px;width:48px;border-radius:50%;object-fit:cover;flex-shrink:0;" onerror="this.style.display='none'">
    <div>
      <h1>Alangudi Aachi Biriyani</h1>
      <div class="sub" style="margin-bottom:0;">Attendance & Salary Report</div>
    </div>
  </div>
  <div class="controls">
    <select id="selMonth"></select>
    <select id="selYear"></select>
    <button onclick="buildReport()">Generate Report</button>
    <span id="reportInfo" style="font-size:11px;color:#888;"></span>
  </div>
  <div id="app"><div class="loading">Select month and click Generate Report</div></div>
</div>

<script>
const SHEET_URL = "https://script.google.com/macros/s/AKfycbz_J4uu4K0641pG2Tm9WyJ7gDG3iYGfiD_v7xNbzGcDCKPNWj0co_-BDJqh0j7le5Nr/exec";
const WORKING_DAYS_BASIS = 26;
let cachedData = null;

function parseName(n){ return n.trim().split(/\s+/)[0]; }
function parseNames(str){ return str ? str.split(',').map(n=>parseName(n)).filter(Boolean) : []; }

function initControls(){
  const mSel=document.getElementById('selMonth');
  const ySel=document.getElementById('selYear');
  ['January','February','March','April','May','June','July','August','September','October','November','December']
    .forEach((m,i)=>{ const o=document.createElement('option'); o.value=i; o.textContent=m; mSel.appendChild(o); });
  const now=new Date();
  mSel.value=now.getMonth();
  for(let y=2025;y<=2027;y++){ const o=document.createElement('option'); o.value=y; o.textContent=y; ySel.appendChild(o); }
  ySel.value=now.getFullYear();
}

async function fetchSheetData(){
  if(cachedData) return cachedData;
  const res = await fetch(SHEET_URL);
  const json = await res.json();
  if(json.status !== 'ok') throw new Error(json.message || 'Sheet error');
  cachedData = json;
  return json;
}

function buildReport(){
  const month=parseInt(document.getElementById('selMonth').value);
  const year=parseInt(document.getElementById('selYear').value);
  const app=document.getElementById('app');
  app.innerHTML='<div class="loading">⏳ Loading data from sheet...</div>';

  fetchSheetData().then(json => {
    try {
      const sessions = json.data.map(r=>{
        const d=new Date(r.date);
        return{date:d,session:r.session,kitchen:parseNames(r.kitchenPresent||''),shop:parseNames(r.shopPresent||''),dow:d.getDay()};
      }).filter(r=>!isNaN(r.date));

      // Build salary master from sheet (only Active employees)
      const salaryMaster = json.salaryMaster || [];
      const SALARY = {};
      salaryMaster.forEach(e=>{
        if(!e.employee) return;
        SALARY[e.employee] = {
          type: e.payType.toLowerCase().includes('month') ? 'monthly' : 'daily',
          rate: e.rate,
          team: e.team,
          role: e.role,
          status: e.status
        };
      });

      // Filter to selected month up to today
      const today=new Date();
      const isCurrentMonth=(today.getMonth()===month && today.getFullYear()===year);
      const cutoff=isCurrentMonth ? today : new Date(year,month+1,0);

      const monthSessions=sessions.filter(r=>r.date.getMonth()===month && r.date.getFullYear()===year && r.date<=cutoff);

      // All working dates (no Mondays)
      const allDates=[];
      for(let d=new Date(year,month,1); d<=new Date(year,month+1,0) && d<=cutoff; d.setDate(d.getDate()+1)){
        if(d.getDay()!==1) allDates.push(new Date(d));
      }

      // dayMap
      const dayMap={};
      monthSessions.forEach(s=>{
        const key=s.date.toDateString();
        if(!dayMap[key]) dayMap[key]={date:s.date,lunch:new Set(),dinner:new Set()};
        const all=[...s.kitchen,...s.shop];
        if(s.session==='Lunch') all.forEach(n=>dayMap[key].lunch.add(n));
        else if(s.session==='Dinner') all.forEach(n=>dayMap[key].dinner.add(n));
      });

      const totalWorkingDays=allDates.length;

      // Active employees only for this month
      // For relieved employees: show only if they worked at least 1 session in this month
      const allNames = new Set();
      monthSessions.forEach(s=>[...s.kitchen,...s.shop].forEach(n=>allNames.add(n)));

      // Combine: active employees + any relieved who appeared this month
      const employees = Object.keys(SALARY).filter(emp=>{
        const s=SALARY[emp];
        if(s.status && s.status.toLowerCase()==='active') return true;
        return allNames.has(parseName(emp)); // relieved but worked this month
      });

      // Per employee attendance
      const empStats={};
      employees.forEach(emp=>{
        let daysWorked=0;
        const dailyLog={};
        const n=parseName(emp);
        allDates.forEach(d=>{
          const key=d.toDateString();
          const rec=dayMap[key];
          const inL=rec&&rec.lunch.has(n);
          const inD=rec&&rec.dinner.has(n);
          let status='absent';
          if(inL&&inD){status='full';daysWorked+=1;}
          else if(inL||inD){status='half';daysWorked+=0.5;}
          dailyLog[key]=status;
        });
        empStats[emp]={daysWorked,dailyLog};
      });

      // Salary calc
      const salaryCalc=employees.map(emp=>{
        const s=SALARY[emp];
        const {daysWorked}=empStats[emp];
        let earned=0;
        if(s.type==='daily'){
          earned=Math.round(daysWorked*s.rate);
        } else {
          earned=Math.round(daysWorked*(s.rate/WORKING_DAYS_BASIS));
        }
        return{emp,...s,daysWorked,earned};
      });

      const totalSalary=salaryCalc.reduce((s,r)=>s+r.earned,0);
      const monthName=['January','February','March','April','May','June','July','August','September','October','November','December'][month];
      document.getElementById('reportInfo').textContent=`${monthName} ${year} · up to ${cutoff.toLocaleDateString('en-IN',{day:'numeric',month:'short'})}`;

      // ── Render ──
      let html=`
      <div class="summary-grid">
        <div class="kpi"><div class="kpi-label">Working days tracked</div><div class="kpi-val">${totalWorkingDays}</div><div class="kpi-sub">${monthName} ${year} (excl. Mondays)</div></div>
        <div class="kpi"><div class="kpi-label">Total salary liability</div><div class="kpi-val">₹${totalSalary.toLocaleString('en-IN')}</div><div class="kpi-sub">as of ${cutoff.toLocaleDateString('en-IN',{day:'numeric',month:'short'})}</div></div>
        <div class="kpi"><div class="kpi-label">Active employees</div><div class="kpi-val">${employees.filter(e=>SALARY[e].status&&SALARY[e].status.toLowerCase()==='active').length}</div><div class="kpi-sub">in salary master</div></div>
      </div>

      <div class="section-title">Salary Summary</div>
      <div class="table-wrap"><table class="salary-table">
        <thead><tr><th>Employee</th><th>Team</th><th>Role</th><th>Pay Type</th><th>Rate</th><th>Days Worked</th><th>Salary Earned</th></tr></thead>
        <tbody>`;

      ['Kitchen','Shop'].forEach(team=>{
        const teamEmps=salaryCalc.filter(r=>r.team===team);
        if(!teamEmps.length) return;
        html+=`<tr><td colspan="7" style="background:#f7f7f5;font-weight:600;font-size:11px;color:#888;padding:5px 10px;">${team} Team</td></tr>`;
        teamEmps.forEach(r=>{
          const typeTag=r.type==='monthly'?`<span class="badge tag-monthly">Monthly</span>`:`<span class="badge tag-daily">Daily</span>`;
          const rateStr=r.type==='monthly'?`₹${r.rate.toLocaleString('en-IN')}/mo`:`₹${r.rate}/day`;
          const relievedTag=r.status&&r.status.toLowerCase()==='relieved'?` <span style="font-size:10px;color:#999;">(Relieved)</span>`:'';
          html+=`<tr>
            <td><strong>${r.emp}</strong>${relievedTag}</td>
            <td>${r.team}</td><td>${r.role}</td><td>${typeTag}</td><td>${rateStr}</td>
            <td>${r.daysWorked} days</td>
            <td>₹${r.earned.toLocaleString('en-IN')}</td>
          </tr>`;
        });
      });

      html+=`<tr style="background:#f7f7f5;">
        <td colspan="6" style="text-align:right;font-weight:600;">Total</td>
        <td style="font-weight:700;font-size:14px;color:#1D9E75;">₹${totalSalary.toLocaleString('en-IN')}</td>
      </tr></tbody></table></div>`;

      // Attendance grid
      html+=`<div class="section-title" style="margin-top:1.5rem;">Day-wise Attendance Grid</div>
      <div class="table-wrap"><table>
        <thead><tr><th>Employee</th>`;
      allDates.forEach(d=>{
        html+=`<th style="min-width:34px;text-align:center;">${d.getDate()}<br><span style="font-size:9px;color:#aaa;">${['Su','M','Tu','W','Th','Fr','Sa'][d.getDay()]}</span></th>`;
      });
      html+=`<th>Days</th></tr></thead><tbody>`;

      ['Kitchen','Shop'].forEach(team=>{
        const teamEmps=employees.filter(e=>SALARY[e].team===team);
        if(!teamEmps.length) return;
        html+=`<tr><td colspan="${allDates.length+2}" style="background:#f7f7f5;font-weight:600;font-size:11px;color:#888;padding:5px 10px;">${team} Team</td></tr>`;
        teamEmps.forEach(emp=>{
          const {daysWorked,dailyLog}=empStats[emp];
          html+=`<tr><td><strong>${emp}</strong><br><span style="font-size:10px;color:#aaa;">${SALARY[emp].role}</span></td>`;
          allDates.forEach(d=>{
            const key=d.toDateString();
            const status=dailyLog[key]||'absent';
            const label=status==='full'?'P':status==='half'?'½':'A';
            const cls=status==='full'?'present':status==='half'?'half':'absent';
            html+=`<td style="text-align:center;"><span class="${cls}">${label}</span></td>`;
          });
          html+=`<td><strong>${daysWorked}</strong></td></tr>`;
        });
      });

      html+=`</tbody></table></div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:.5rem;font-size:11px;color:#666;">
        <span><span class="present">P</span> Present (full day)</span>
        <span><span class="half">½</span> Half day (1 session only)</span>
        <span><span class="absent">A</span> Absent</span>
      </div>`;

      app.innerHTML=html;
    } catch(e){
      app.innerHTML=`<div class="error">Error building report: ${e.message}</div>`;
    }
  }).catch(e=>{
    app.innerHTML=`<div class="error">Could not load sheet data: ${e.message}</div>`;
  });
}

initControls();
</script>
</body>
</html>
